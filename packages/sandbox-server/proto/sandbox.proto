syntax = "proto3";

package prodisco.sandbox.v1;

// SandboxService handles code execution in a secure sandbox environment.
// The implementation determines the runtime (TypeScript, Go, etc.).
service SandboxService {
  // Execute runs code in the sandbox (blocking, waits for completion)
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // ExecuteStream runs code with real-time output streaming
  rpc ExecuteStream(ExecuteRequest) returns (stream ExecuteChunk);

  // ExecuteAsync starts execution and returns immediately with an execution ID
  rpc ExecuteAsync(ExecuteRequest) returns (ExecuteAsyncResponse);

  // GetExecution retrieves status and output of an async execution
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);

  // CancelExecution cancels a running execution
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);

  // ListExecutions lists active and recent executions
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);

  // HealthCheck verifies the sandbox server is running and properly configured
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // ListCache returns all cached entries for indexing/discovery
  rpc ListCache(ListCacheRequest) returns (ListCacheResponse);

  // ClearCache removes all cached entries
  rpc ClearCache(ClearCacheRequest) returns (ClearCacheResponse);

  // ExecuteTest runs code with tests and returns structured results
  rpc ExecuteTest(ExecuteTestRequest) returns (ExecuteTestResponse);

  // =========================================================================
  // LSP Operations - Language Server Protocol for code intelligence
  // =========================================================================

  // LspWorkspaceSymbol searches for symbols by name across the workspace
  rpc LspWorkspaceSymbol(LspWorkspaceSymbolRequest) returns (LspWorkspaceSymbolResponse);

  // LspHover gets type information and documentation at a position
  rpc LspHover(LspPositionRequest) returns (LspHoverResponse);

  // LspGoToDefinition finds where a symbol is defined
  rpc LspGoToDefinition(LspPositionRequest) returns (LspLocationsResponse);

  // LspFindReferences finds all references to a symbol
  rpc LspFindReferences(LspReferencesRequest) returns (LspLocationsResponse);

  // LspDocumentSymbol lists all symbols in a document
  rpc LspDocumentSymbol(LspDocumentRequest) returns (LspDocumentSymbolResponse);
}

message ExecuteRequest {
  oneof source {
    // Code to execute
    string code = 1;
    // Name of a cached execution to run
    string cached = 2;
  }

  // Execution timeout in milliseconds
  optional int32 timeout_ms = 3;
}

// CacheEntry represents a cached execution that can be re-run
message CacheEntry {
  // Unique name of the cached entry (e.g., "list-pods-abc123.ts")
  string name = 1;

  // Human-readable description extracted from the code
  string description = 2;

  // Timestamp when the entry was cached (milliseconds since epoch)
  int64 created_at_ms = 3;

  // Content hash for deduplication
  string content_hash = 4;
}

message ExecuteResponse {
  // Whether execution completed successfully
  bool success = 1;

  // Captured output (stdout/console)
  string output = 2;

  // Error message if execution failed
  optional string error = 3;

  // Execution time in milliseconds
  int64 execution_time_ms = 4;

  // Full cache entry if this execution was newly cached
  // Not set if execution failed or if the code was already cached (duplicate)
  optional CacheEntry cached = 5;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  // Whether the server is healthy
  bool healthy = 1;

  // Current Kubernetes context name (if applicable)
  string kubernetes_context = 2;
}

message ListCacheRequest {
  // Optional filter pattern (e.g., "list-*" or "pods")
  optional string filter = 1;
}

message ListCacheResponse {
  // All matching cache entries
  repeated CacheEntry entries = 1;
}

message ClearCacheRequest {}

message ClearCacheResponse {
  // Number of entries deleted
  int64 deleted_count = 1;
}

// ============================================================================
// Streaming and Async Execution Messages
// ============================================================================

// ExecutionState represents the lifecycle state of an execution
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_PENDING = 1;     // Queued, waiting to run
  EXECUTION_STATE_RUNNING = 2;     // Currently executing
  EXECUTION_STATE_COMPLETED = 3;   // Finished successfully
  EXECUTION_STATE_FAILED = 4;      // Finished with error
  EXECUTION_STATE_CANCELLED = 5;   // Cancelled by user
  EXECUTION_STATE_TIMEOUT = 6;     // Exceeded time limit
}

// ExecuteChunk is a streaming response chunk during execution
message ExecuteChunk {
  // Unique execution ID (same across all chunks)
  string execution_id = 1;

  // Type of chunk
  oneof chunk {
    // Output data (stdout/console.log)
    string output = 2;
    // Error output (stderr/console.error)
    string error_output = 3;
    // Final result when execution completes
    ExecuteResult result = 4;
  }

  // Timestamp of this chunk (milliseconds since epoch)
  int64 timestamp_ms = 5;
}

// ExecuteResult is the final result sent as the last chunk
message ExecuteResult {
  // Whether execution completed successfully
  bool success = 1;

  // Error message if execution failed
  optional string error = 2;

  // Total execution time in milliseconds
  int64 execution_time_ms = 3;

  // Final execution state
  ExecutionState state = 4;

  // Cache entry if newly cached
  optional CacheEntry cached = 5;
}

// ExecuteAsyncResponse is returned immediately when starting async execution
message ExecuteAsyncResponse {
  // Unique execution ID for tracking
  string execution_id = 1;

  // Initial state (typically PENDING or RUNNING)
  ExecutionState state = 2;
}

// GetExecutionRequest requests status of an async execution
message GetExecutionRequest {
  // Execution ID from ExecuteAsyncResponse
  string execution_id = 1;

  // If true, wait for completion (long-poll)
  bool wait = 2;

  // Offset in output buffer to start reading from (for incremental reads)
  int64 output_offset = 3;
}

// GetExecutionResponse contains current status and buffered output
message GetExecutionResponse {
  // Execution ID
  string execution_id = 1;

  // Current state
  ExecutionState state = 2;

  // Buffered output since offset (stdout)
  string output = 3;

  // Buffered error output since offset (stderr)
  string error_output = 4;

  // Current total output length (for next offset)
  int64 output_length = 5;

  // Current total error output length
  int64 error_output_length = 6;

  // Result if execution has finished (state is terminal)
  optional ExecuteResult result = 7;
}

// CancelExecutionRequest cancels a running execution
message CancelExecutionRequest {
  // Execution ID to cancel
  string execution_id = 1;
}

// CancelExecutionResponse confirms cancellation
message CancelExecutionResponse {
  // Whether cancellation was successful
  bool success = 1;

  // Current state after cancellation attempt
  ExecutionState state = 2;

  // Message if cancellation failed (e.g., already completed)
  optional string message = 3;
}

// ListExecutionsRequest lists executions
message ListExecutionsRequest {
  // Filter by state (empty = all states)
  repeated ExecutionState states = 1;

  // Maximum number of results
  int32 limit = 2;

  // Include completed executions from last N milliseconds
  int64 include_completed_within_ms = 3;
}

// ExecutionInfo is summary info about an execution
message ExecutionInfo {
  // Execution ID
  string execution_id = 1;

  // Current state
  ExecutionState state = 2;

  // When execution started
  int64 started_at_ms = 3;

  // When execution finished (if terminal state)
  optional int64 finished_at_ms = 4;

  // Code preview (first 100 chars)
  string code_preview = 5;

  // Whether using cached script
  bool is_cached = 6;

  // Cached script name if is_cached
  optional string cached_name = 7;
}

// ListExecutionsResponse contains list of executions
message ListExecutionsResponse {
  // List of execution summaries
  repeated ExecutionInfo executions = 1;
}

// ============================================================================
// Test Execution Messages
// ============================================================================

// ExecuteTestRequest runs code with tests and returns structured results
message ExecuteTestRequest {
  // Implementation code to test (optional - tests may be self-contained)
  optional string code = 1;

  // Test code using uvu framework
  string tests = 2;

  // Execution timeout in milliseconds
  optional int32 timeout_ms = 3;
}

// TestResult represents a single test result
message TestResult {
  // Name of the test
  string name = 1;

  // Whether the test passed
  bool passed = 2;

  // Error message if the test failed
  optional string error = 3;

  // Duration of the test in milliseconds
  int64 duration_ms = 4;
}

// TestSummary contains aggregated test results
message TestSummary {
  // Total number of tests
  int32 total = 1;

  // Number of passed tests
  int32 passed = 2;

  // Number of failed tests
  int32 failed = 3;

  // Number of skipped tests
  int32 skipped = 4;
}

// ExecuteTestResponse contains the test execution results
message ExecuteTestResponse {
  // Whether all tests passed
  bool success = 1;

  // Summary of test results
  TestSummary summary = 2;

  // Individual test results
  repeated TestResult tests = 3;

  // Captured console output
  string output = 4;

  // Total execution time in milliseconds
  int64 execution_time_ms = 5;

  // Error message if test execution itself failed
  optional string error = 6;
}

// ============================================================================
// LSP (Language Server Protocol) Messages
// ============================================================================

// LspWorkspaceSymbolRequest searches for symbols by name
message LspWorkspaceSymbolRequest {
  // Query string to search for (partial match supported)
  string query = 1;

  // Maximum number of results to return
  optional int32 limit = 2;
}

// LspPositionRequest specifies a position in a document
message LspPositionRequest {
  // File path (absolute path to file in node_modules or scripts cache)
  string file_path = 1;

  // Line number (1-based, as shown in editors)
  int32 line = 2;

  // Character offset (0-based)
  int32 character = 3;
}

// LspReferencesRequest extends position request with options
message LspReferencesRequest {
  // File path (absolute path to file)
  string file_path = 1;

  // Line number (1-based)
  int32 line = 2;

  // Character offset (0-based)
  int32 character = 3;

  // Include the declaration in results
  bool include_declaration = 4;
}

// LspDocumentRequest specifies a document
message LspDocumentRequest {
  // File path (absolute path to file)
  string file_path = 1;
}

// LspRange represents a range in a document
message LspRange {
  // Start line (1-based)
  int32 start_line = 1;

  // Start character (0-based)
  int32 start_character = 2;

  // End line (1-based)
  int32 end_line = 3;

  // End character (0-based)
  int32 end_character = 4;
}

// LspLocation represents a location in a file
message LspLocation {
  // File URI (e.g., file:///path/to/file.ts)
  string uri = 1;

  // Range within the file
  LspRange range = 2;
}

// LspSymbolKind represents the kind of a symbol
enum LspSymbolKind {
  LSP_SYMBOL_KIND_UNSPECIFIED = 0;
  LSP_SYMBOL_KIND_FILE = 1;
  LSP_SYMBOL_KIND_MODULE = 2;
  LSP_SYMBOL_KIND_NAMESPACE = 3;
  LSP_SYMBOL_KIND_PACKAGE = 4;
  LSP_SYMBOL_KIND_CLASS = 5;
  LSP_SYMBOL_KIND_METHOD = 6;
  LSP_SYMBOL_KIND_PROPERTY = 7;
  LSP_SYMBOL_KIND_FIELD = 8;
  LSP_SYMBOL_KIND_CONSTRUCTOR = 9;
  LSP_SYMBOL_KIND_ENUM = 10;
  LSP_SYMBOL_KIND_INTERFACE = 11;
  LSP_SYMBOL_KIND_FUNCTION = 12;
  LSP_SYMBOL_KIND_VARIABLE = 13;
  LSP_SYMBOL_KIND_CONSTANT = 14;
  LSP_SYMBOL_KIND_STRING = 15;
  LSP_SYMBOL_KIND_NUMBER = 16;
  LSP_SYMBOL_KIND_BOOLEAN = 17;
  LSP_SYMBOL_KIND_ARRAY = 18;
  LSP_SYMBOL_KIND_OBJECT = 19;
  LSP_SYMBOL_KIND_KEY = 20;
  LSP_SYMBOL_KIND_NULL = 21;
  LSP_SYMBOL_KIND_ENUM_MEMBER = 22;
  LSP_SYMBOL_KIND_STRUCT = 23;
  LSP_SYMBOL_KIND_EVENT = 24;
  LSP_SYMBOL_KIND_OPERATOR = 25;
  LSP_SYMBOL_KIND_TYPE_PARAMETER = 26;
}

// LspSymbolInfo represents a symbol found in the workspace
message LspSymbolInfo {
  // Symbol name
  string name = 1;

  // Kind of symbol (class, interface, function, etc.)
  LspSymbolKind kind = 2;

  // Library name extracted from path (e.g., "@kubernetes/client-node")
  string library = 3;

  // Container name (e.g., parent class or module)
  string container_name = 4;

  // Location of the symbol
  LspLocation location = 5;
}

// LspWorkspaceSymbolResponse contains workspace symbol search results
message LspWorkspaceSymbolResponse {
  // Matching symbols
  repeated LspSymbolInfo symbols = 1;

  // Total number of matches (may be more than returned due to limit)
  int32 total_matches = 2;
}

// LspHoverResponse contains hover information
message LspHoverResponse {
  // Markdown content (documentation, type info)
  string contents = 1;

  // Range that the hover applies to
  optional LspRange range = 2;
}

// LspLocationsResponse contains location results
message LspLocationsResponse {
  // List of locations
  repeated LspLocation locations = 1;
}

// LspDocumentSymbol represents a symbol in a document (hierarchical)
message LspDocumentSymbol {
  // Symbol name
  string name = 1;

  // Kind of symbol
  LspSymbolKind kind = 2;

  // More detail (e.g., signature)
  string detail = 3;

  // Range of the whole symbol including documentation
  LspRange range = 4;

  // Range of the symbol name
  LspRange selection_range = 5;

  // Children symbols (for hierarchical structure)
  repeated LspDocumentSymbol children = 6;
}

// LspDocumentSymbolResponse contains document symbols
message LspDocumentSymbolResponse {
  // List of symbols in the document
  repeated LspDocumentSymbol symbols = 1;
}
